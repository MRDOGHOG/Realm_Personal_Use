<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1118">
<title>PORTALS</title>
<style>
:root{
  --ground:#0E1118; --panel:#161B26; --panel-hi:#1D2431;
  --line:rgba(255,255,255,.07); --line-hi:rgba(255,255,255,.14);
  --ink:#E8ECF5; --dim:#79839A; --dimmer:#4E566B;
  --de:#F0A63C; --la:#55C7DF; --dm:#A98BE0; --ph:#FF7A5C; --wk:#74C69D; --rd:#B9C3D6;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans)}
body{padding:0 0 60px;overscroll-behavior-y:none}

/* ---- masthead ---- */
header{
  position:sticky;top:0;z-index:20;background:rgba(14,17,24,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:14px 16px 12px;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.brand h1{
  margin:0;font-size:19px;font-weight:800;letter-spacing:7px;
  font-family:var(--mono);text-transform:uppercase;
}
.brand .sub{font-size:10.5px;color:var(--dimmer);letter-spacing:1.6px;font-family:var(--mono);text-transform:uppercase}
.brand .home{
  margin-left:auto;flex:none;text-decoration:none;color:var(--dim);
  font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;
  border:1px solid var(--line-hi);border-radius:7px;padding:7px 10px;
}
.brand .home:active{background:var(--panel-hi);color:var(--ink)}
.find{position:relative}
.find input{
  width:100%;background:var(--panel);border:1px solid var(--line-hi);color:var(--ink);
  font-size:16px;font-family:var(--sans);padding:13px 40px 13px 14px;border-radius:11px;outline:none;
}
.find input::placeholder{color:var(--dimmer)}
.find input:focus{border-color:var(--la);box-shadow:0 0 0 3px rgba(85,199,223,.13)}
.find .x{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  background:none;border:0;color:var(--dim);font-size:20px;padding:8px 10px;cursor:pointer;display:none;
}
.find.on .x{display:block}

/* ---- lanes ---- */
main{padding:16px 14px 0}
.lane{display:flex;gap:12px;margin-bottom:22px}
.spine{
  flex:none;width:34px;border-radius:9px;background:var(--c);
  display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;text-orientation:mixed;
  font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:3.5px;
  color:#0B0E14;padding:14px 0;text-transform:uppercase;
}
.stack{flex:1;min-width:0}
.lane h2{
  margin:0 0 3px;font-size:15.5px;font-weight:700;letter-spacing:-.2px;
}
.lane .note{margin:0 0 10px;font-size:12.5px;color:var(--dim);line-height:1.45}

/* ---- destinations ---- */
a.dest{
  display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:13px 13px;margin-bottom:7px;transition:background .13s,border-color .13s,transform .09s;
}
a.dest:active{transform:scale(.985);background:var(--panel-hi)}
@media(hover:hover){a.dest:hover{background:var(--panel-hi);border-color:var(--line-hi)}}
a.dest:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.tag{
  flex:none;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1.2px;
  color:var(--c);border:1px solid var(--c);opacity:.85;border-radius:5px;padding:4px 6px;
  min-width:54px;text-align:center;text-transform:uppercase;
}
.label{flex:1;min-width:0;font-size:15px;line-height:1.35}
.label small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px;line-height:1.4}
.go{flex:none;color:var(--dimmer);font-size:15px}

.empty{color:var(--dim);font-size:14px;padding:26px 4px;line-height:1.6}
.empty b{color:var(--ink);font-weight:600}
footer{color:var(--dimmer);font-size:11.5px;padding:22px 18px 0;line-height:1.6;font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Portals</h1>
    <span class="sub">straight to the material</span>
    <a class="home" href="index.html">&#9876; REALM</a>
  </div>
  <div class="find" id="find">
    <input id="q" type="search" placeholder="Filter — try 18.06, video, pset, karpathy" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="x" id="clear" aria-label="Clear filter">×</button>
  </div>
</header>

<main id="board"></main>
<footer id="foot"></footer>

<script>
const LANES = [
 {code:'18.03', c:'var(--de)', name:'Differential Equations',
  note:'Spring 2010. Video lectures are the 2003 Mattuck series — the correlation table maps them to this course.',
  dests:[
   {t:'Video lectures', s:'Mattuck, 32 lectures', k:'video', u:'https://ocw.mit.edu/courses/18-03-differential-equations-spring-2010/video_galleries/video-lectures/'},
   {t:'Lecture correlation table', s:'which video goes with which session', k:'index', u:'https://ocw.mit.edu/courses/18-03-differential-equations-spring-2010/resources/lecture-video-correlation-table/'},
   {t:'Course home', s:'notes, recitations, psets, exams', k:'home', u:'https://ocw.mit.edu/courses/18-03-differential-equations-spring-2010/'}
  ]},
 {code:'18.06', c:'var(--la)', name:'Linear Algebra',
  note:'18.06SC, Fall 2011. Session-based: watch, then do that session\u2019s problems before moving on.',
  dests:[
   {t:'Lecture videos', s:'Strang, 35 lectures', k:'video', u:'https://ocw.mit.edu/courses/18-06sc-linear-algebra-fall-2011/video_galleries/lecture-videos/'},
   {t:'Resource index', s:'every session, problem set and solution', k:'index', u:'https://ocw.mit.edu/courses/18-06sc-linear-algebra-fall-2011/pages/resource-index/'},
   {t:'Course home', s:'', k:'home', u:'https://ocw.mit.edu/courses/18-06sc-linear-algebra-fall-2011/'}
  ]},
 {code:'PHYS', c:'var(--ph)', name:'Mechanics — AP Physics 1',
  note:'Khan Academy. Nine units. Progress is tracked on Khan itself; REALM only records the percentage.',
  dests:[
   {t:'AP Physics 1 course', s:'all nine units', k:'course', u:'https://www.khanacademy.org/science/ap-college-physics-1'},
   {t:'Physics library', s:'wider set, if a unit needs backing up', k:'extra', u:'https://www.khanacademy.org/science/physics'}
  ]},
 {code:'6.042', c:'var(--dm)', name:'Mathematics for Computer Science',
  note:'Fall 2010, Leighton. Off the clock — no deadlines, carries into the school year.',
  dests:[
   {t:'Video lectures', s:'Leighton & van Dijk', k:'video', u:'https://ocw.mit.edu/courses/6-042j-mathematics-for-computer-science-fall-2010/video_galleries/video-lectures/'},
   {t:'Syllabus', s:'', k:'index', u:'https://ocw.mit.edu/courses/6-042j-mathematics-for-computer-science-fall-2010/pages/syllabus/'},
   {t:'Course home', s:'recitations, psets, exams', k:'home', u:'https://ocw.mit.edu/courses/6-042j-mathematics-for-computer-science-fall-2010/'}
  ]},
 {code:'Bench', c:'var(--wk)', name:'The workshop',
  note:'The things the courses are actually for.',
  dests:[
   {t:'Modern Robotics', s:'Lynch & Park — book, videos, software', k:'book', u:'https://hades.mech.northwestern.edu/index.php/Modern_Robotics'},
   {t:'Zero to Hero', s:'Karpathy — the transformer road', k:'course', u:'https://karpathy.ai/zero-to-hero.html'}
  ]},
 {code:'Shelf', c:'var(--rd)', name:'Papers',
  note:'Top group needs nothing you don\u2019t already have. The rest wait for the linear algebra.',
  dests:[
   {t:'Dijkstra 1959', s:'shortest paths — three pages, read now', k:'read now', u:'https://www.cs.yale.edu/homes/lans/readings/routing/dijkstra-routing-1959.pdf'},
   {t:'Cooley & Tukey 1965', s:'the FFT — four pages, read now', k:'read now', u:'https://www.ams.org/journals/mcom/1965-19-090/S0025-5718-1965-0178586-1/S0025-5718-1965-0178586-1.pdf'},
   {t:'Attention Is All You Need', s:'you have already built one', k:'read now', u:'https://arxiv.org/abs/1706.03762'},
   {t:'Batch Normalization', s:'pairs with Karpathy #4 and #5', k:'read now', u:'https://arxiv.org/abs/1502.03167'},
   {t:'ResNet', s:'one skip connection, beautifully written', k:'read now', u:'https://arxiv.org/abs/1512.03385'},
   {t:'EEGNet', s:'ordinary CNNs pointed at electrodes', k:'read now', u:'https://arxiv.org/abs/1611.08024'},
   {t:'Buss 2004 — IK survey', s:'wants pseudoinverse and least squares', k:'after 18.06', u:'https://mathweb.ucsd.edu/~sbuss/ResearchWeb/ikmethods/iksurvey.pdf'},
   {t:'Welch & Bishop — Kalman', s:'wants covariance matrices', k:'after 18.06', u:'https://www.cs.unc.edu/~welch/media/pdf/kalman_intro.pdf'},
   {t:'Madgwick 2010', s:'IMU orientation, quaternions', k:'after 18.06', u:'https://x-io.co.uk/downloads/madgwick_internal_report.pdf'},
   {t:'Bloesch 2013', s:'legged state estimation — the one for the Steed', k:'after both', u:'https://www.roboticsproceedings.org/rss08/p17.pdf'},
   {t:'Hartley 2020', s:'contact-aided invariant EKF', k:'after both', u:'https://arxiv.org/abs/1904.09251'}
  ]}
];

const board = document.getElementById('board');
const foot  = document.getElementById('foot');
const q     = document.getElementById('q');
const find  = document.getElementById('find');

function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

function draw(filter){
  const f = (filter||'').trim().toLowerCase();
  let shown = 0, lanes = 0;
  board.innerHTML = LANES.map(L=>{
    const hits = L.dests.filter(d=>{
      if(!f) return true;
      return (L.code+' '+L.name+' '+d.t+' '+d.s+' '+d.k).toLowerCase().includes(f);
    });
    if(!hits.length) return '';
    shown += hits.length; lanes++;
    return `<section class="lane" style="--c:${L.c}">
      <div class="spine">${esc(L.code)}</div>
      <div class="stack">
        <h2>${esc(L.name)}</h2>
        ${!f ? `<p class="note">${esc(L.note)}</p>` : ''}
        ${hits.map(d=>`<a class="dest" href="${d.u}" target="_blank" rel="noopener">
          <span class="tag">${esc(d.k)}</span>
          <span class="label">${esc(d.t)}${d.s?`<small>${esc(d.s)}</small>`:''}</span>
          <span class="go">&#8250;</span>
        </a>`).join('')}
      </div></section>`;
  }).join('');

  if(!shown){
    board.innerHTML = `<p class="empty">Nothing matches <b>${esc(filter)}</b>.<br>
      Try a course code, or a word like <b>video</b>, <b>index</b>, <b>read now</b>.</p>`;
  }
  const total = LANES.reduce((a,L)=>a+L.dests.length,0);
  foot.textContent = f ? `${shown} of ${total} shown` : `${total} destinations across ${LANES.length} lanes`;
  find.classList.toggle('on', !!f);
}

q.addEventListener('input', e=>draw(e.target.value));
document.getElementById('clear').addEventListener('click', ()=>{ q.value=''; draw(''); q.focus(); });
draw('');
</script>
</body>
</html>
